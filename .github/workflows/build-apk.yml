name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip native]')"

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Inject Version Code
        run: |
          jq '.expo.android.versionCode = ${{ github.run_number }}' app.json > temp.json && mv temp.json app.json

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Configure Build Optimizations (Shrink APK)
        run: |
          sed -i 's/defaultConfig {/defaultConfig {\n        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }/' android/app/build.gradle

      - name: Configure Gradle Memory
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/release.keystore

      - name: Build Release APK
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign APK with apksigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          # Zipalign the APK first (required for perfect v2/v3 signing)
          $BUILD_TOOLS_DIR/zipalign -v 4 android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          
          # Sign the aligned APK explicitly enforcing all 3 signature blocks
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks $GITHUB_WORKSPACE/release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            android/app/build/outputs/apk/release/app-release-aligned.apk
            
          # Replace original with aligned & signed version
          mv android/app/build/outputs/apk/release/app-release-aligned.apk android/app/build/outputs/apk/release/app-release.apk

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="update-${{ github.run_number }}"
          gh release create $TAG_NAME android/app/build/outputs/apk/release/app-release.apk --title "FoodParkCC Build #${{ github.run_number }}" --notes ""
